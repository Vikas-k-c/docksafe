services:
  backend:
    build:
      context: ./backend
    image: docksafe-backend:local
    container_name: docksafe-backend
    env_file:
      - ./backend/.env.example
    environment:
      DOCKSAFE_PORT: 5000
      TRIVY_IMAGE_SOURCE: remote
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      FAST_SCAN_MODE: true
      SCAN_TIMEOUT_MS: 180000
    ports:
      - "${DOCKSAFE_BACKEND_PORT:-5001}:5000"
    volumes:
      - trivy-cache:/root/.cache/trivy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${DOCKSAFE_BACKEND_PORT:-5001}
    image: docksafe-frontend:local
    container_name: docksafe-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  trivy-cache:
